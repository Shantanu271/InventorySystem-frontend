<div class="page-wrapper">
  <div class="header-row">
    <h2>🍺 Add Beer Stock</h2>
    <button class="btn-secondary" (click)="goBack()">← Back</button>
  </div>

  <!-- MODE SWITCH -->
  <div class="mode-switch">
    <button
      class="mode-btn"
      [class.active]="mode === 'SCAN'"
      (click)="switchMode('SCAN')"
    >
      📷 Scan Barcode
    </button>

    <button
      class="mode-btn"
      [class.active]="mode === 'MANUAL'"
      (click)="switchMode('MANUAL')"
    >
      ✍️ Manual Entry
    </button>
  </div>

  <!-- INFO / ERROR -->
  <div *ngIf="errorMessage" class="alert alert-error">
    {{ errorMessage }}
  </div>

  <div *ngIf="infoMessage" class="alert alert-info">
    {{ infoMessage }}
  </div>

  <!-- SCAN MODE ONLY -->
  <div *ngIf="mode === 'SCAN'" class="card">
    <h3>Scan Barcode</h3>
    <p class="hint">
      Focus here and scan using wireless scanner (ENTER auto submits)
    </p>

    <div class="field-row">
      <input
        type="text"
        placeholder="Scan or type barcode"
        [(ngModel)]="scanBarcode"
        (keyup.enter)="onScanConfirm()"
        autofocus
      />
      <button class="btn-primary" (click)="onScanConfirm()">Use</button>
    </div>
  </div>

  <!-- PRODUCT FORM (COMMON FOR BOTH MODES) -->
  <div class="card">
    <h3>Beer Details</h3>

    <form (ngSubmit)="onSubmit()" #f="ngForm">
      <div class="form-grid">

        <div class="field">
          <label>Brand Name *</label>
          <input
            type="text"
            [(ngModel)]="form.brandName"
            name="brandName"
            required
            [autofocus]="mode === 'MANUAL'"
          />
        </div>
        <div class="field">
          <label>SKU Code *</label>
          <input
            type="text"
            [(ngModel)]="form.skuCode"
            name="skuCode"
            required
            placeholder="SKU-23562"
          />
        </div>

        <div class="field">
          <label>Barcode</label>
          <input type="text" [(ngModel)]="form.barcode" name="barcode" />
        </div>

        <div class="field">
          <label>Alcohol Strength (%)</label>
          <input type="number" step="0.01" [(ngModel)]="form.strengthVv" name="strengthVv" />
        </div>

        <div class="field">
          <label>Bottle Size (ml)</label>
          <input type="number" [(ngModel)]="form.bottleSizeMl" name="bottleSizeMl" />
        </div>

        <div class="field">
          <label>MRP Approved (₹)</label>
          <input type="number" [(ngModel)]="form.mrpApproved" name="mrpApproved" />
        </div>

        <div class="field">
          <label>No. of Cases</label>
          <input type="number" [(ngModel)]="form.noOfCases" name="noOfCases" />
        </div>

        <div class="field">
          <label>Bottles per Case</label>
          <input type="number" [(ngModel)]="form.noOfBottles" name="noOfBottles" />
        </div>

        <div class="field">
          <label>Batch Number</label>
          <input type="text" [(ngModel)]="form.batchNumber" name="batchNumber" />
        </div>

        <div class="field">
          <label>Month of Manufacturing</label>
          <input type="month" [(ngModel)]="form.monthOfMfg" name="monthOfMfg" />
        </div>

        <div class="field readonly">
          <label>Total Bottles</label>
          <input type="number" [value]="totalBottles" readonly />
        </div>

      </div>

      <div class="actions-row">
        <button
          class="btn-primary"
          type="submit"
          [disabled]="!f.valid || saving"
        >
          {{ saving ? 'Saving...' : 'Save Stock' }}
        </button>
      </div>
    </form>
  </div>
</div>
